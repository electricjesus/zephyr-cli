name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update package version
        run: |
          bun --version
          sed -i 's/"version": "[^"]*"/"version": "${{ steps.version.outputs.VERSION }}"/' package.json
          sed -i 's/\.version("[^"]*")/.version("${{ steps.version.outputs.VERSION }}")/' src/index.ts

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Create release branch
        run: |
          git checkout -b release/v${{ steps.version.outputs.VERSION }}
          git add package.json bun.lock src/index.ts
          git diff --staged --quiet || git commit -m "chore: bump version to v${{ steps.version.outputs.VERSION }}"
          git push --force origin release/v${{ steps.version.outputs.VERSION }}

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const version = '${{ steps.version.outputs.VERSION }}';

            const pr = await github.rest.pulls.create({
              title: `chore: release v${version}`,
              owner,
              repo,
              head: `release/v${version}`,
              base: 'main',
              body: [
                `# Release v${version}`,
                '',
                '## Installation',
                '```bash',
                '# Linux',
                `curl -L https://github.com/${owner}/${repo}/releases/latest/download/zephyr-linux-x64 -o zephyr`,
                'chmod +x zephyr',
                '',
                '# macOS (Apple Silicon)',
                `curl -L https://github.com/${owner}/${repo}/releases/latest/download/zephyr-macos-arm64 -o zephyr`,
                'chmod +x zephyr',
                '',
                '# macOS (Intel)',
                `curl -L https://github.com/${owner}/${repo}/releases/latest/download/zephyr-macos-x64 -o zephyr`,
                'chmod +x zephyr',
                '```',
                '',
                `**Full Changelog**: https://github.com/${owner}/${repo}/compare/v${version}...HEAD`
              ].join('\n')
            });

  build-binaries:
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            artifact: zephyr-macos-arm64
          - os: macos-latest
            target: darwin-x64
            artifact: zephyr-macos-x64
          - os: ubuntu-latest
            target: linux-x64
            artifact: zephyr-linux-x64
          - os: windows-latest
            target: windows-x64
            artifact: zephyr-windows-x64.exe

    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Update version in source
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' 's/\.version("[^"]*")/.version("${{ steps.version.outputs.VERSION }}")/' src/index.ts
          else
            sed -i 's/\.version("[^"]*")/.version("${{ steps.version.outputs.VERSION }}")/' src/index.ts
          fi
        shell: bash

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Do NOT pass --target on macOS — triggers corrupt Mach-O signature (bun >= 1.3.12)
            bun build src/index.ts --compile --outfile ${{ matrix.artifact }}
          else
            bun build src/index.ts --compile --target=bun-${{ matrix.target }} --outfile ${{ matrix.artifact }}
          fi
        shell: bash

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - ${{ matrix.artifact }}
          codesign --verify ${{ matrix.artifact }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact }}
          tag_name: v${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-formula:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v${{ steps.version.outputs.VERSION }}

      - name: Download release binaries and compute SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          gh release download "v${VERSION}" \
            --pattern "zephyr-macos-arm64" \
            --pattern "zephyr-macos-x64" \
            --pattern "zephyr-linux-x64" \
            --dir /tmp/bins
          echo "SHA_MACOS_ARM64=$(sha256sum /tmp/bins/zephyr-macos-arm64 | awk '{print $1}')" >> $GITHUB_ENV
          echo "SHA_MACOS_X64=$(sha256sum /tmp/bins/zephyr-macos-x64 | awk '{print $1}')" >> $GITHUB_ENV
          echo "SHA_LINUX_X64=$(sha256sum /tmp/bins/zephyr-linux-x64 | awk '{print $1}')" >> $GITHUB_ENV

      - name: Patch formula
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          python3 - <<'EOF'
          import re, os

          formula = open("Formula/zephyr.rb").read()

          formula = re.sub(r'version "[^"]*"', f'version "{os.environ["VERSION"]}"', formula)

          # Replace sha256 immediately following each platform URL — works for both
          # first-run placeholders and subsequent real hashes.
          def patch_sha(text, binary, new_sha):
              return re.sub(
                  r'(url ".*' + re.escape(binary) + r'.*"\n\s+sha256 ")[^"]*(")',
                  lambda m: m.group(1) + new_sha + m.group(2),
                  text,
              )

          formula = patch_sha(formula, "zephyr-macos-arm64", os.environ["SHA_MACOS_ARM64"])
          formula = patch_sha(formula, "zephyr-macos-x64",   os.environ["SHA_MACOS_X64"])
          formula = patch_sha(formula, "zephyr-linux-x64",   os.environ["SHA_LINUX_X64"])

          open("Formula/zephyr.rb", "w").write(formula)
          print("Formula updated.")
          EOF

      - name: Commit formula update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/zephyr.rb
          git commit -m "chore: update formula SHA256 for v${{ steps.version.outputs.VERSION }}"
          git push origin release/v${{ steps.version.outputs.VERSION }}
